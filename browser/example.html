<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OpenPine browser example</title>
</head>
<body>
<h1>OpenPine 브라우저 데모</h1>
<pre id="out">실행 중...</pre>

<script src="../core/pine-host.js"></script>
<script src="../core/pine-engine.js"></script>
<script src="../core/pine-types.js"></script>
<script src="../core/pine-interpreter.js"></script>
<script src="../core/pine-strategy.js"></script>
<script src="../core/pine-builtins.js"></script>
<script src="openpine.browser.js"></script>
<script>
const source = `//@version=6
indicator("SMA demo", overlay=true)
len = input.int(14, "Length")
s = ta.sma(close, len)
plot(s, "SMA")
`;

const bars = [];
let price = 100;
for(let i = 0; i < 30; i++){
  price += (Math.random() - 0.5) * 2;
  const o = price, c = price + (Math.random() - 0.5);
  bars.push({
    time: 1700000000 + i * 60,
    open: o, high: Math.max(o, c) + 0.5, low: Math.min(o, c) - 0.5, close: c, volume: 1000 + i,
  });
}

const result = OpenPine.run(source, bars, { inputOverrides: {} });
const smaPlot = [...result.plots.values()][0];
document.getElementById('out').textContent =
  'SMA last 5 values:\n' + JSON.stringify(smaPlot.values.slice(-5), null, 2);
</script>
</body>
</html>
